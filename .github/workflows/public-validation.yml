name: Public Android validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# This workflow only checks the reproducible public source. It has no signing,
# deployment, Gateway, device, or repository-write credentials.
permissions:
  contents: read

concurrency:
  group: public-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  JAVA_TOOL_OPTIONS: -XX:ActiveProcessorCount=2 -Duser.language=en -Duser.country=US
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim unused runner SDKs
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          # This disposable runner installs its pinned Android SDK below.
          # The image's duplicate SDK, .NET, Haskell and CodeQL are unused.
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm 12.5.1
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack install --global pnpm@12.5.1
          test "$(pnpm --version)" = "12.5.1"

      - name: Set up Android SDK 37 and NDK 28.2
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/android-sdk"
          tools_version=16111833
          archive="commandlinetools-linux-${tools_version}_latest.zip"
          expected_sha256=0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8
          mkdir -p "$sdk_root/cmdline-tools"
          curl --fail --location --silent --show-error --connect-timeout 10 --max-time 300 \
            "https://dl.google.com/android/repository/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$expected_sha256" "$RUNNER_TEMP/$archive" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/$archive" -d "$sdk_root/cmdline-tools"
          mv "$sdk_root/cmdline-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses >/dev/null || [[ "${PIPESTATUS[1]}" -eq 0 ]]
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Verify public release staging
        shell: pwsh
        run: ./Test-ReleaseStaging.ps1

      - name: Inspect nested native archive for workstation paths
        shell: bash
        run: python3 tools/check-release-paths.py third_party/sherpa-clock1/*.aar

      - name: Prepare pinned OpenClaw source and public overlay
        shell: pwsh
        run: ./Prepare-AndroidSource.ps1 -Destination "$env:RUNNER_TEMP/openclaw-source"

      - name: Install pinned Node dependencies
        working-directory: ${{ runner.temp }}/openclaw-source
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run Android unit tests and assemble debug APK
        working-directory: ${{ runner.temp }}/openclaw-source/apps/android
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            :app:testThirdPartyDebugUnitTest \
            :app:assembleThirdPartyDebug

      - name: Upload public Android unit-test XML
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: android-third-party-unit-test-results
          path: ${{ runner.temp }}/openclaw-source/apps/android/app/build/test-results/testThirdPartyDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 7
