# WirePlumber 0.5 SPA-JSON configuration. Do not expose headset/HFP profiles:
# playback is A2DP; the USB webcam/microphone stays a separate capture source.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
}

# The dedicated kiosk user owns Bluetooth even while its graphical session
# restarts during OTA. Seat churn must not remove the speaker's audio nodes.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
